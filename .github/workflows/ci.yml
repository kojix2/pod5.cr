name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - run: ./scripts/test_downloads.sh
      - run: ./scripts/install_native.sh
      - run: ./scripts/download_fixtures.sh
      - run: crystal tool format --check src spec examples scripts/*.cr
      - run: for script in scripts/*.sh; do sh -n "$script" || exit; done
      - run: ./scripts/check_abi.sh
      - run: ./scripts/with_native.sh crystal spec
      - run: ./scripts/with_native.sh crystal spec --release
      - run: ./scripts/with_native.sh shards build
